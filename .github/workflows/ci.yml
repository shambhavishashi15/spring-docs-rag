name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit and integration tests. Testcontainers uses the runner's Docker for pgvector.
      # No secrets: tests never call Gemini (the AI models are mocked).
      - name: Build and test
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t spring-docs-rag .
