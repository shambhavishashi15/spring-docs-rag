spring:
  application:
    name: spring-docs-rag
  # Dev defaults match compose.yaml; override with env vars elsewhere.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/springdocsrag}
    username: ${DB_USERNAME:springdocsrag}
    password: ${DB_PASSWORD:springdocsrag}
  ai:
    model:
      # Turns off the OpenAI embedding auto-configuration so the Google GenAI one is the only
      # EmbeddingModel (it is enabled by spring.ai.model.embedding.text, which defaults to on).
      embedding: none
    vectorstore:
      pgvector:
        # Creates the vector_store table and index on startup (off by default).
        initialize-schema: true
        # Must match the embedding dimensions, so it references them. Set explicitly so startup
        # never calls the embedding API to discover it.
        dimensions: ${spring.ai.google.genai.embedding.text.options.dimensions}
        index-type: hnsw
        distance-type: cosine-distance
    openai:
      # Chat only. Gemini's OpenAI-compatible endpoint; the OpenAI SDK appends "/chat/completions"
      # to this URL, so no completions-path override is needed (Spring AI 2.x has no such property).
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY}
      chat:
        # Free tier: 500 requests/day and 15/min (gemini-3.8-flash allows only 20/day and 5/min,
        # less than one eval run).
        model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
    google:
      genai:
        # Embeddings via Gemini's native API (Gemini Developer API mode: API key, no Vertex AI project).
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
              # Gemini defaults to 3072; 768 keeps us under pgvector HNSW's 2000-dimension limit.
              dimensions: 768

# TextSplitter logs one INFO line per section it splits.
logging:
  level:
    org.springframework.ai.transformer.splitter: warn

app:
  embedding:
    # Retries Gemini embedding calls on 429 and 5xx with exponential backoff (5s, 10s, 20s, 40s, then 60s).
    # Free-tier quotas are per minute, so the backoff must be able to wait out a full minute.
    retry:
      max-attempts: 8
      initial-delay: 5s
      max-delay: 60s
  ingestion:
    # Holds manifest.csv and the HTML fetched by scripts/fetch-docs.sh.
    docs-dir: ${DOCS_DIR:docs}
    # Characters per chunk and characters shared with the previous chunk (must be < chunk-size / 2).
    chunk-size: 1200
    chunk-overlap: 200
  ask:
    # Chunks retrieved per question (~1,200 characters each).
    top-k: 6
    # Minimum cosine similarity (0 accepts all); tune once the eval gives data.
    similarity-threshold: 0.0
